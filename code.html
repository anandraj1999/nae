<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DRACE - Interstellar Racing HUD</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&amp;family=Sora:wght@100..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @keyframes star-flicker {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
        }
        .hud-glass {
            backdrop-filter: blur(20px);
            background: rgba(21, 16, 38, 0.7);
            border: 1px solid rgba(0, 219, 233, 0.4);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .skew-x-10 { transform: skewX(-10deg); }
        .skew-x-5 { transform: skewX(-5deg); }
        
        /* Segmented Progress Bar */
        .segmented-bar {
            display: flex;
            gap: 2px;
        }
        .segment {
            height: 12px;
            width: 4px;
            background: rgba(219, 252, 255, 0.2);
        }
        .segment.active-cyan { background: #00f0ff; box-shadow: 0 0 8px #00f0ff; }
        .segment.active-magenta { background: #fe00fe; box-shadow: 0 0 8px #fe00fe; }

        canvas#race-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1e182e 0%, #151026 100%);
        }

        /* Chromatic Aberration Effect at Edges */
        .vignette-fx {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            background: radial-gradient(circle, transparent 60%, rgba(255, 0, 255, 0.05) 85%, rgba(0, 240, 255, 0.1) 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.4);
        }

        /* Neon Pulse Animation for HUD borders */
        @keyframes neon-pulse {
            0%, 100% { border-color: rgba(0, 219, 233, 0.4); }
            50% { border-color: rgba(0, 219, 233, 0.9); box-shadow: 0 0 15px rgba(0, 219, 233, 0.4); }
        }
        .pulse-border {
            animation: neon-pulse 2s infinite ease-in-out;
        }

        /* Motion Trail Effect for Car */
        .motion-trail {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 150px;
            background: linear-gradient(to top, rgba(254, 0, 254, 0.15) 0%, transparent 80%);
            filter: blur(20px);
            z-index: 1;
            border-radius: 50% 50% 0 0;
        }

        /* Dynamic Engine Glow */
        @keyframes engine-throb {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 0.9; }
        }
        .engine-glow {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 60px;
            background: radial-gradient(ellipse at center, rgba(0, 240, 255, 0.6) 0%, transparent 70%);
            filter: blur(15px);
            animation: engine-throb 0.5s infinite alternate;
            z-index: 2;
        }
    </style>

<animatemotion dur="10s" path="M50 10 C 80 10, 90 40, 90 60 C 90 80, 70 90, 50 90 C 30 90, 10 80, 10 60 C 10 40, 20 10, 50 10" repeatcount="indefinite"></animatemotion>

<div class="absolute bottom-2 right-2 font-label-bold text-[10px] text-primary-fixed-dim uppercase tracking-wider">Sector 2</div>

<!-- Bottom Navigation (Desktop Only) -->
<nav class="bg-surface-container/60 backdrop-blur-2xl fixed bottom-0 w-full z-50 rounded-t-2xl border-t border-primary/30 shadow-[0_-10px_30px_rgba(0,0,0,0.7)] flex justify-around items-center px-4 pb-4 pt-2 hidden md:flex">

<div class="flex flex-col items-center justify-center text-primary-fixed-dim px-4 py-2 opacity-70 hover:opacity-100 hover:text-secondary-fixed transition-transform duration-200 active:scale-90">
<span class="material-symbols-outlined">groups</span>
<span class="font-label-bold text-label-bold">SOCIAL</span>
</div>
<div class="flex flex-col items-center justify-center text-primary-fixed-dim px-4 py-2 opacity-70 hover:opacity-100 hover:text-secondary-fixed transition-transform duration-200 active:scale-90">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-bold text-label-bold">SETTINGS</span>
</div>

<script>
    // Starfield + Light Speed Streaks
    const canvas = document.getElementById('race-bg');
    const ctx = canvas.getContext('2d');
    let stars = [];
    const starCount = 600;
    let speedMult = 15;

    function initStars() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        stars = [];
        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                z: Math.random() * canvas.width,
                size: Math.random() * 2
            });
        }
    }

    function drawStars() {
        ctx.fillStyle = "rgba(21, 16, 38, 0.4)"; // Faded trail for movement effect
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        stars.forEach(star => {
            const oldZ = star.z;
            star.z -= speedMult; 
            
            if (star.z <= 0) {
                star.z = canvas.width;
                star.x = Math.random() * canvas.width;
                star.y = Math.random() * canvas.height;
            }

            const k = 128.0 / star.z;
            const px = (star.x - centerX) * k + centerX;
            const py = (star.y - centerY) * k + centerY;

            const oldK = 128.0 / oldZ;
            const oldPX = (star.x - centerX) * oldK + centerX;
            const oldPY = (star.y - centerY) * oldK + centerY;

            if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                const opacity = 1 - star.z / canvas.width;
                
                // Draw Streak
                ctx.beginPath();
                ctx.strokeStyle = `rgba(219, 252, 255, ${opacity * 0.8})`;
                ctx.lineWidth = (1 - star.z / canvas.width) * 3;
                ctx.moveTo(oldPX, oldPY);
                ctx.lineTo(px, py);
                ctx.stroke();

                // Draw Core Star
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.beginPath();
                ctx.arc(px, py, (1 - star.z / canvas.width) * 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        });
        
        // Slightly increase speed over time up to a cap
        if(speedMult < 45) speedMult += 0.002;

        requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', initStars);
    initStars();
    drawStars();

    // Speedometer dynamic value
    const speedEl = document.getElementById('speed-val');
    setInterval(() => {
        const current = parseInt(speedEl.innerText);
        const fluctuation = Math.floor(Math.random() * 7) - 3;
        speedEl.innerText = Math.max(240, Math.min(275, current + fluctuation));
    }, 100);

    // Boost Bar generation
    const boostBar = document.getElementById('boost-bar');
    for (let i = 0; i < 24; i++) {
        const segment = document.createElement('div');
        segment.className = 'segment';
        if (i < 18) segment.classList.add('active-cyan');
        if (i >= 20) segment.classList.add('active-magenta');
        boostBar.appendChild(segment);
    }

    // Engine Pulse Reaction Logic (Visual Fake)
    const engineGlow = document.querySelector('.engine-glow');
    let tick = 0;
    function pulseLogic() {
        tick++;
        const intensity = Math.sin(tick * 0.2) * 5 + 15;
        engineGlow.style.filter = `blur(${intensity}px)`;
        requestAnimationFrame(pulseLogic);
    }
    pulseLogic();
</script>
